name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  # No paths-ignore on pull requests: a skipped workflow never reports its required checks.
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Lint, format check, build, coverage on Chromium, Firefox and WebKit with jQuery 3.7.1, and a check
  # that the committed dist/ matches the build.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Get Playwright version
        id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-all
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm test
      - name: Check committed dist matches the build
        run: git diff --exit-code -- dist

  # The suite and the end-to-end tests against the jQuery support floor, the latest 3.x, and 4.x.
  jquery:
    name: jQuery ${{ matrix.jquery }} on ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        jquery: ["1.7.2", "3.7.1", "4.0.0"]
        include:
          - { jquery: "1.7.2", file: ".jquery/jquery-1.7.2.js" }
          - { jquery: "3.7.1", file: "node_modules/jquery3/dist/jquery.js" }
          - { jquery: "4.0.0", file: "node_modules/jquery4/dist/jquery.js" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Get Playwright version
        id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-${{ matrix.browser }}
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Fetch jQuery 1.7.2
        if: matrix.jquery == '1.7.2'
        run: scripts/fetch-jquery.sh 1.7.2
      - name: Run the suite
        run: npx vitest run --project suite-${{ matrix.browser }}
        env:
          JQUERY_FILE: ${{ matrix.file }}
      - name: Run the end-to-end tests
        run: npm run test:e2e -- --project ${{ matrix.browser }}
        env:
          JQUERY_FILE: ${{ matrix.file }}
